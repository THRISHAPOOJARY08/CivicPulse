<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicPulse — AI-Powered Civic Complaint Platform</title>

    <!-- Google Fonts: Material Symbols + Inter + Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS + JS via CDN (must load before React app) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Tailwind CSS via CDN — matching exact Stitch design token config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'tertiary': '#001329',
              'on-primary-fixed': '#011d35',
              'inverse-surface': '#283044',
              'on-secondary-fixed': '#00201d',
              'inverse-primary': '#b0c9e8',
              'tertiary-fixed-dim': '#abc8f4',
              'outline': '#74777e',
              'on-background': '#131b2e',
              'surface-dim': '#d2d9f4',
              'surface-container-low': '#f2f3ff',
              'on-surface-variant': '#43474d',
              'on-secondary': '#ffffff',
              'on-error-container': '#93000a',
              'on-secondary-container': '#006f66',
              'surface-container-lowest': '#ffffff',
              'on-primary-container': '#7991af',
              'on-primary': '#ffffff',
              'on-tertiary-fixed-variant': '#2a486d',
              'surface-bright': '#faf8ff',
              'secondary-fixed-dim': '#6bd8cb',
              'surface-container': '#eaedff',
              'outline-variant': '#c3c6ce',
              'background': '#faf8ff',
              'on-surface': '#131b2e',
              'primary-container': '#0f2942',
              'error-container': '#ffdad6',
              'secondary-container': '#86f2e4',
              'on-tertiary-container': '#7390b9',
              'surface-variant': '#dae2fd',
              'surface-tint': '#49607c',
              'on-secondary-fixed-variant': '#005049',
              'on-primary-fixed-variant': '#314863',
              'tertiary-container': '#02284b',
              'inverse-on-surface': '#eef0ff',
              'error': '#ba1a1a',
              'on-tertiary': '#ffffff',
              'surface-container-highest': '#dae2fd',
              'on-tertiary-fixed': '#001c38',
              'secondary-fixed': '#89f5e7',
              'on-error': '#ffffff',
              'surface-container-high': '#e2e7ff',
              'secondary': '#006a61',
              'tertiary-fixed': '#d3e4ff',
              'primary-fixed-dim': '#b0c9e8',
              'primary-fixed': '#d1e4ff',
              'primary': '#001428',
              'surface': '#faf8ff'
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px'
            },
            spacing: {
              gutter: '1.5rem',
              'space-xs': '0.25rem',
              'space-sm': '0.5rem',
              'space-md': '1rem',
              'space-lg': '1.5rem',
              'space-xl': '2.5rem',
              margin: '2rem'
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
            },
            fontSize: {
              'display-lg': ['40px', { lineHeight: '48px', letterSpacing: '-0.02em', fontWeight: '700' }],
              'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.015em', fontWeight: '600' }],
              'headline-md': ['22px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }],
              'headline-sm': ['18px', { lineHeight: '24px', fontWeight: '600' }],
              'body-lg': ['16px', { lineHeight: '24px' }],
              'body-md': ['14px', { lineHeight: '20px' }],
              'body-sm': ['12px', { lineHeight: '18px' }],
              'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }],
              'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' }],
              'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.03em', fontWeight: '600' }]
            }
          }
        }
      };
    </script>

    <style>
      @layer base {
        html, body { margin: 0; padding: 0; }
        body { overscroll-behavior: none; font-family: 'Inter', system-ui, sans-serif; background-color: #faf8ff; color: #131b2e; }
        * { box-sizing: border-box; }
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f2f3ff; }
      ::-webkit-scrollbar-thumb { background: #c3c6ce; border-radius: 3px; }
      .leaflet-container { z-index: 1; }
      .font-display-lg { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 40px; line-height: 48px; letter-spacing: -0.02em; font-weight: 700; }
      .font-headline-lg { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 32px; line-height: 40px; letter-spacing: -0.015em; font-weight: 600; }
      .font-headline-md { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 22px; line-height: 28px; letter-spacing: -0.01em; font-weight: 600; }
      .font-headline-sm { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 600; }
      .font-body-lg { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 24px; }
      .font-body-md { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 20px; }
      .font-body-sm { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 18px; }
      .font-label-lg { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 20px; letter-spacing: 0.01em; font-weight: 600; }
      .font-label-md { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 16px; letter-spacing: 0.02em; font-weight: 600; }
      .font-label-sm { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.03em; font-weight: 600; }
      .text-display-lg { font-size: 40px !important; line-height: 48px !important; }
      .text-headline-lg { font-size: 32px !important; line-height: 40px !important; }
      .text-headline-md { font-size: 22px !important; line-height: 28px !important; }
      .text-headline-sm { font-size: 18px !important; line-height: 24px !important; }
      .text-body-lg { font-size: 16px !important; line-height: 24px !important; }
      .text-body-md { font-size: 14px !important; line-height: 20px !important; }
      .text-body-sm { font-size: 12px !important; line-height: 18px !important; }
      .text-label-lg { font-size: 14px !important; line-height: 20px !important; }
      .text-label-md { font-size: 12px !important; line-height: 16px !important; }
      .text-label-sm { font-size: 11px !important; line-height: 14px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
